grafana:
  enabled: true

  adminUser: admin
  adminPassword: Admin@123

  service:
    type: ClusterIP

  persistence:
    enabled: true
    storageClassName: gp2
    size: 10Gi

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true


prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    externalUrl: /prometheus
    routePrefix: /prometheus


alertmanager:
  enabled: true

  service:
    type: ClusterIP

  alertmanagerSpec:
    externalUrl: /alertmanager
    routePrefix: /alertmanager


nodeExporter:
  enabled: true


kubeStateMetrics:
  enabled: true