apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slack-test-alert
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: slack-test
      rules:
        - alert: SlackTestAlert
          expr: vector(1)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Slack integration test"
            description: "Test alert from Prometheus to Alertmanager."