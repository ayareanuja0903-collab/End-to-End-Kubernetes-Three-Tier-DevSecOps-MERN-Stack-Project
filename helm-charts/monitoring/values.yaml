kube-prometheus-stack:

  grafana:
    enabled: true

    adminUser: admin
    adminPassword: Admin@123

    service:
      type: ClusterIP

    persistence:
      enabled: true
      storageClassName: gp2
      size: 10Gi

    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana/"
        serve_from_sub_path: true

  prometheus:
    enabled: true

    prometheusSpec:
      externalUrl: "http://%(domain)s/prometheus"
      routePrefix: /prometheus

      retention: 15d

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi

  alertmanager:
    enabled: true

    alertmanagerSpec:
      externalUrl: "http://%(domain)s/alertmanager"

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi