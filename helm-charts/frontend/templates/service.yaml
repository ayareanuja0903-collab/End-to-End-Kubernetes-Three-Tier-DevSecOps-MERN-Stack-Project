apiVersion: v1

kind: Service


metadata:

  name: frontend-service
  namespace: argocd


spec:

  type: ExternalName
  externalName: frontend-service.three-tier-app.svc.cluster.local


  selector:

    app: frontend



  ports:

  - port: {{ .Values.service.port }}

    targetPort: 80



  type: {{ .Values.service.type }}