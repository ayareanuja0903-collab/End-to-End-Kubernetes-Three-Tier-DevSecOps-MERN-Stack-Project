---
- name: Security Tools
  hosts: all
  become: yes

  vars:
    aws_region: ap-south-1
    cluster_name: three-tier-dev-eks
    kubeconfig_path: /home/ubuntu/.kube/config

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
    AWS_DEFAULT_REGION: ap-south-1

  tasks:

    # -------------------------
    # Configure EKS kubeconfig
    # -------------------------

    - name: Update EKS kubeconfig
      shell: |
        aws eks update-kubeconfig \
        --region {{ aws_region }} \
        --name {{ cluster_name }}
      become_user: ubuntu


    - name: Verify Kubernetes connection
      command: kubectl get nodes
      register: kubernetes_nodes
      changed_when: false


    - name: Display Kubernetes nodes
      debug:
        var: kubernetes_nodes.stdout_lines


    # -------------------------
    # Install Required Packages
    # -------------------------

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - unzip
          - gnupg
        state: present
        update_cache: yes
  # -------------------------
  # Install Trivy
  # -------------------------

    - name: Install Trivy
      shell: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/trivy

    - name: Verify Trivy installation
      command: /usr/local/bin/trivy --version
      register: trivy_version
      changed_when: false

    - name: Display Trivy version
      debug:
        msg: "{{ trivy_version.stdout }}"


    # -------------------------
    # SonarScanner Installation
    # -------------------------

    - name: Download SonarScanner CLI
      get_url:
        url: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.3.0.5189-linux-x64.zip
        dest: /tmp/sonar-scanner.zip


    - name: Extract SonarScanner
      unarchive:
        src: /tmp/sonar-scanner.zip
        dest: /opt
        remote_src: yes
        creates: /opt/sonar-scanner-7.3.0.5189-linux-x64


    - name: Create SonarScanner symlink
      file:
        src: /opt/sonar-scanner-7.3.0.5189-linux-x64/bin/sonar-scanner
        dest: /usr/local/bin/sonar-scanner
        state: link


    # -------------------------
    # SonarQube Helm Setup
    # -------------------------

    - name: Add SonarQube Helm repository
      command: >
        helm repo add sonarqube
        https://SonarSource.github.io/helm-chart-sonarqube
      register: sonar_repo
      failed_when: false
      changed_when: false


    - name: Update Helm repositories
      command: helm repo update


    # -------------------------
    # SonarQube Deployment
    # -------------------------

    - name: Create SonarQube namespace
      command: kubectl create namespace sonarqube
      register: sonar_namespace
      failed_when: false
      changed_when: "'created' in sonar_namespace.stdout"


    - name: Install SonarQube
      command: >
        helm upgrade --install sonarqube
        sonarqube/sonarqube
        --namespace sonarqube
        --create-namespace
        -f {{ playbook_dir }}/../files/sonarqube-values.yaml


    # -------------------------
    # Expose SonarQube
    # -------------------------

    - name: Expose SonarQube Service
      command: >
        kubectl patch svc sonarqube-sonarqube
        -n sonarqube
        -p '{"spec":{"type":"LoadBalancer"}}'
      failed_when: false


    # -------------------------
    # Verification
    # -------------------------

    - name: Wait for SonarQube pods
      command: kubectl get pods -n sonarqube
      register: sonar_status
      changed_when: false


    - name: Display SonarQube Status
      debug:
        var: sonar_status.stdout
